kind = "web"
previewPath = "/"
title = "AgroSaathi — Agricultural Platform"
version = "1.0.0"
id = "artifacts/agri-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23923

[services.development]
run = "pnpm --filter @workspace/agri-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agri-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/agri-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23923"
BASE_PATH = "/"
