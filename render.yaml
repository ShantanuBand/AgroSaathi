services:
  - type: web
    name: agri-clarity-backend
    env: docker
    region: singapore
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AGMARKNET_API_KEY
        sync: false
